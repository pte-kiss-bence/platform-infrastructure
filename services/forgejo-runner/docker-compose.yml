# Forgejo Runner — Dokploy compose service a PTE-Forgejo-Runner remote szerveren.
# Hivatalos DinD minta (forgejo.org/docs: admin/actions/installation/docker):
# a CI jobok a docker-in-docker konténerben futnak, a host Dockerhez
# (amit a Dokploy kezel) a jobok nem érnek hozzá.
# Dokploy env-ben megadandó (Environment fül) — értékek a Forgejo VPS
# /root/forgejo-runner-secret fájljából (forgejo-bootstrap.sh írja ki):
#   RUNNER_SECRET  — 40 hex karakteres shared secret
#   RUNNER_UUID    — a regisztráció által visszaadott UUID
# A runner-init csak első indításkor ír configot; env-csere után töröld a
# runner-data volume-ot vagy a /data/runner-config.yml fájlt, és redeployolj.

services:
  docker-in-docker:
    image: docker:dind
    privileged: true
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    restart: unless-stopped
    volumes:
      - dind-data:/var/lib/docker

  runner-init:
    image: data.forgejo.org/forgejo/runner:12
    user: root
    environment:
      FORGEJO_INSTANCE_URL: https://git.pte-dev.hu/
      RUNNER_SECRET: ${RUNNER_SECRET}
      RUNNER_UUID: ${RUNNER_UUID}
    volumes:
      - runner-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /data/runner-config.yml ]; then
          printf 'log:\n  level: info\nrunner:\n  capacity: 2\n  timeout: 1h\nserver:\n  connections:\n    forgejo:\n      url: %s\n      uuid: %s\n      token: %s\n' \
            "$$FORGEJO_INSTANCE_URL" "$$RUNNER_UUID" "$$RUNNER_SECRET" > /data/runner-config.yml
          echo "runner-config.yml létrehozva"
        fi
        chown -R 1001:1001 /data

  runner:
    image: data.forgejo.org/forgejo/runner:12
    restart: unless-stopped
    depends_on:
      runner-init:
        condition: service_completed_successfully
      docker-in-docker:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    user: 1001:1001
    working_dir: /data
    volumes:
      - runner-data:/data
    command: ["forgejo-runner", "daemon", "--config", "/data/runner-config.yml"]

volumes:
  runner-data:
  dind-data:
